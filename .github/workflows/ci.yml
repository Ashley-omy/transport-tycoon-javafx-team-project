name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Compile
        run: mvn --batch-mode --errors --no-transfer-progress clean compile

      - name: Test
        run: mvn --batch-mode --errors --no-transfer-progress test jacoco:report

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
